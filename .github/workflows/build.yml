name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore FanControl.GigabyteWMI.sln

    - name: Build solution
      run: dotnet build FanControl.GigabyteWMI.sln --configuration Release --no-restore

    - name: Run Unit Tests (xUnit)
      run: dotnet test FanControl.GigabyteWMI.sln --configuration Release --no-build --verbosity normal

    - name: Package Plugin DLL
      run: |
        Compress-Archive -Path "bin\Release\net48\FanControl.GigabyteWMI.dll" -DestinationPath "FanControl.GigabyteWMI.zip"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FanControl.GigabyteWMI
        path: FanControl.GigabyteWMI.zip
